name: Build and promote container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-promotion
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cagea1.com
  CONFIG_REPOSITORY: ${{ vars.CONFIG_REPOSITORY }}
  CONFIG_PATH: overlays/prod/cagea1/kustomization.yaml

jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify config repository setting
        run: test -n "$CONFIG_REPOSITORY"

      - name: Generate GitHub App token for config repository
        id: config-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CONFIG_REPO_APP_ID }}
          private-key: ${{ secrets.CONFIG_REPO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.CONFIG_REPOSITORY }}

      - name: Check out config repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.CONFIG_REPOSITORY }}
          token: ${{ steps.config-token.outputs.token }}
          path: config

      - name: Promote immutable image tag
        working-directory: config
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ github.sha }}
        run: |
          test -n "$CONFIG_REPOSITORY"
          sed -i -E "s#(^[[:space:]]*newTag:[[:space:]]*).*$#\\1${TAG}#" "$CONFIG_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CONFIG_PATH"
          git diff --cached --quiet || git commit -m "deploy(cagea1.com): ${TAG}"
          git push
