name: PROD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cagea1-production
  cancel-in-progress: false

env:
  dockerimage_tag: ${{ github.sha }}
  dockerimage_name: lightstone1/cagea1.com-prod

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Code repo checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.dockerimage_name }}
          tags: |
            ${{ env.dockerimage_tag }}
            latest
          flavor: latest=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Config repo checkout
        uses: actions/checkout@v4
        with:
          repository: taeboranger/cagea1.com-config
          ref: main
          token: ${{ secrets.ACTION_TOKEN }}
          path: cagea1-config

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2.0.0

      - name: Update Kustomize image tag
        working-directory: cagea1-config/overlays/prod/cagea1
        run: |
          kustomize edit set image ${{ env.dockerimage_name }}:${{ env.dockerimage_tag }}
          cat kustomization.yaml

      - name: Push config repository update
        working-directory: cagea1-config
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add overlays/prod/cagea1/kustomization.yaml
          git diff --cached --quiet || git commit -m "deploy(cagea1.com): ${{ github.sha }}"
          git push origin main
